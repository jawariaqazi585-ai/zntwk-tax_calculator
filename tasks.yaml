apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  params:
    - name: repo-url
      type: string
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        git clone $(params.repo-url) .
    - name: npm-install
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  params:
    - name: repo-url
      type: string
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        git clone $(params.repo-url) .
    - name: npm-install
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
    - name: run-jasmine-tests
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npx jasmine
